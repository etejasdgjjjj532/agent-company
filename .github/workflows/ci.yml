name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm test
      - run: npm run build

  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build the core and fetch Electron
        working-directory: apps/desktop
        run: npm run prepare-core && node scripts/ensure-electron.mjs
      - name: Start the app (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run -a npx electron . --no-sandbox
        env:
          AGENT_COMPANY_SELFTEST: ${{ runner.temp }}/shot.png
          AGENT_COMPANY_HOME: ${{ runner.temp }}/home
      - name: Start the app (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        run: npx electron .
        env:
          AGENT_COMPANY_SELFTEST: ${{ runner.temp }}/shot.png
          AGENT_COMPANY_HOME: ${{ runner.temp }}/home
